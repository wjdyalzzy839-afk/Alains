<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Alains AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #fff;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d6b45a;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .status {
      color: #aaa;
      font-size: 12px;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #d6b45a;
      border-radius: 50%;
      margin-left: 6px;
    }

    .avatar {
      margin: 35px auto 20px;
      width: 160px;
      height: 185px;
      border: 1px solid #8d7335;
      border-radius: 80px 80px 30px 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #d6b45a;
      background: radial-gradient(circle, #222, #080808);
      box-shadow: 0 0 35px rgba(190, 155, 60, .15);
      text-align: center;
      padding: 20px;
    }

    .avatar span {
      font-size: 13px;
      line-height: 1.8;
    }

    .greeting {
      text-align: center;
      margin-bottom: 20px;
    }

    .greeting h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .greeting p {
      color: #999;
      font-size: 14px;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0 20px;
    }

    .message {
      max-width: 90%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.8;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user-message {
      align-self: flex-start;
      background: #252015;
      border: 1px solid #594720;
    }

    .ai-message {
      align-self: flex-end;
      background: #151515;
      border: 1px solid #333;
    }

    .error-message {
      color: #ffb4a9;
      border-color: #743d35;
    }

    .chat {
      position: sticky;
      bottom: 0;
      margin-top: auto;
      display: flex;
      gap: 10px;
      padding: 15px 0 5px;
      background: #050505;
    }

    input {
      min-width: 0;
      flex: 1;
      background: #111;
      border: 1px solid #39301b;
      border-radius: 25px;
      padding: 14px 18px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #b8953d;
    }

    button {
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #c5a24b;
      color: #050505;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="logo">ALAINS</div>
      <div class="status">المساعد الشخصي</div>
    </header>

    <div class="avatar">
      <span>Alains AI<br>شخصيتك الذكية<br>قريبًا بتجربة ثلاثية الأبعاد</span>
    </div>

    <section class="greeting">
      <h1>أهلاً وجدي، معك Alains</h1>
      <p>كيف أستطيع مساعدتك اليوم؟</p>
    </section>

    <section
      id="messages"
      class="messages"
      aria-live="polite"
      aria-label="المحادثة"
    ></section>

    <form id="chatForm" class="chat">
      <input
        id="message"
        type="text"
        placeholder="اكتب رسالتك إلى Alains..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit" aria-label="إرسال">➤</button>
    </form>

    <p class="hint">Alains — مساعدك الشخصي الذكي</p>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function addMessage(text, type, isError = false) {
      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      if (isError) {
        bubble.classList.add("error-message");
      }

      bubble.textContent = text;
      messages.appendChild(bubble);

      return bubble;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || sendButton.disabled) {
        return;
      }

      addMessage(message, "user-message");
      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      const waiting = addMessage("Alains يفكر...", "ai-message");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        waiting.remove();

        if (!response.ok) {
          throw new Error(
            data.error || "تعذر الحصول على رد من الخادم."
          );
        }

        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("وصل رد فارغ من الخادم.");
        }

        addMessage(data.reply, "ai-message");

      } catch (error) {
        waiting.remove();

        addMessage(
          "لم أتمكن من الرد الآن. تحقق من اتصال الخادم وإعدادات الذكاء الاصطناعي، ثم حاول مجددًا.",
          "ai-message",
          true
        );

        console.error("Alains chat error:", error);

      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
