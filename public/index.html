<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alains</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #d6b45a;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .menu {
      color: #d6b45a;
      font-size: 25px;
    }

    .avatar {
      margin: 55px auto 25px;
      width: 190px;
      height: 250px;
      border: 1px solid #8d7335;
      border-radius: 95px 95px 35px 35px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #777;
      background: radial-gradient(circle, #171717, #080808);
      box-shadow: 0 0 35px rgba(190, 155, 60, 0.15);
      text-align: center;
      padding: 20px;
    }

    .avatar span {
      font-size: 14px;
      line-height: 1.7;
    }

    .greeting {
      text-align: center;
      margin-bottom: 25px;
    }

    .greeting h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .greeting p {
      color: #999;
      font-size: 14px;
    }

    .chat {
      margin-top: auto;
      display: flex;
      gap: 10px;
      padding-top: 20px;
    }

    input {
      flex: 1;
      background: #111;
      border: 1px solid #39301b;
      border-radius: 25px;
      padding: 14px 18px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #b8953d;
    }

    button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #c5a24b;
      color: #050505;
      font-size: 20px;
      cursor: pointer;
    }

    #reply {
      text-align: center;
      color: #d6b45a;
      min-height: 25px;
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="logo">ALAINS</div>
      <div class="menu">☰</div>
    </div>

    <div class="avatar">
      <span>مكان شخصية Alains<br>الثلاثية الأبعاد</span>
    </div>

    <div class="greeting">
      <h1>أهلاً وجدي، معك Alains</h1>
      <p>كيف أنت اليوم؟</p>
    </div>

    <div id="reply"></div>

    <div class="chat">
      <input id="message" type="text" placeholder="اكتب رسالتك إلى Alains...">
      <button onclick="sendMessage()">➤</button>
    </div>

  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const reply = document.getElementById("reply");

      if (input.value.trim() === "") {
        return;
      }

      reply.textContent = "وصلت رسالتك";
      input.value = "";
    }
  </script>

</body>
</html>
